[package]
name = "animeow"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["bevy_dev_tools"] }
bevy_asset = "0.19.1"
blake3 = { version = "1.8", features = ["pure"] }

# Ускорение сборки в dev-режиме:
# Отключаем отладочную информацию — сильно ускоряет компоновку
[profile.dev]
debug = false
